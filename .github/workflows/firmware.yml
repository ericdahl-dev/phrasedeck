# Compiles the panel firmware (#68). Compile only: flashing needs the board.
name: firmware

on:
  pull_request:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Required checks can't be skipped with on.paths, so the job runs and skips its work when
      # a pull request doesn't touch these paths.
      - id: changes
        working-directory: .
        run: .github/scripts/touches.sh '^(firmware/|\.github/workflows/firmware\.yml$|\.github/scripts/touches\.sh$)'
      - uses: actions/cache@v4
        if: steps.changes.outputs.run == 'true'
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - uses: astral-sh/setup-uv@v6
        if: steps.changes.outputs.run == 'true'
      - run: uv tool install platformio==6.2.0
        if: steps.changes.outputs.run == 'true'
      - run: pio test -e native
        if: steps.changes.outputs.run == 'true'
      - run: pio run -e crowpanel
        if: steps.changes.outputs.run == 'true'

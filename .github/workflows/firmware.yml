# Compiles the panel firmware (#68). Compile only: flashing needs the board.
name: firmware

on:
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install platformio==6.2.0
      - run: pio test -e native
      - run: pio run -e crowpanel

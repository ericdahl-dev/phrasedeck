# Tag a version on main (for example v0.2.0) to build the Linux Helper packages (#78) and attach
# them to that tag's GitHub Release: a .deb and a tarball per arch, the AUR phrased-bin PKGBUILD,
# phrased-bin.install and .SRCINFO (built and checked with makepkg), plus SHA256SUMS. Pushing those
# to the AUR is a separate, manual step. release.yml uploads the iOS app from the same tag.
# The mac job (#66) attaches a universal phrased, signed with Developer ID and notarized, and the
# Homebrew cask for it (phrased.rb, copied to the tap by hand). Without the signing secrets it
# builds and checks an unsigned zip and attaches nothing.
name: helper-release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  linux:
    if: github.repository == 'ericdahl-dev/phrasedeck'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag
        run: |
          # As in release.yml: only from main or a release/ branch, so a stray tag can't publish.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            && ! git branch -r --contains "$GITHUB_SHA" | grep -q '^ *origin/release/'; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main or a release/ branch."
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - name: Build and check the packages
        run: |
          GOTOOLCHAIN=auto go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          version=${GITHUB_REF_NAME#v}
          for arch in amd64 arm64; do
            packaging/build-linux.sh "$version" "$arch" "$RUNNER_TEMP/pkg"
            packaging/check-deb.sh "$RUNNER_TEMP/pkg/phrased_${version}_$arch.deb"
          done
          packaging/aur/render.sh "$version" "$RUNNER_TEMP/pkg"
          docker run --rm -v "$PWD:/w" -v "$RUNNER_TEMP/pkg:/pkg" archlinux:latest \
            sh /w/packaging/aur/makepkg-check.sh /pkg "$version"
          (cd "$RUNNER_TEMP/pkg" && sudo chown -R "$(id -u)" . && sha256sum * .SRCINFO > SHA256SUMS && cat SHA256SUMS)
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The mac job may create it at the same moment; losing that race is fine.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "Helper packages." ||
            gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/pkg/* "$RUNNER_TEMP/pkg/.SRCINFO" --clobber

  mac:
    if: github.repository == 'ericdahl-dev/phrasedeck'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: helper
    env:
      # Set only when every signing secret is there; the signing steps check it.
      SIGN: ${{ secrets.MAC_DEVID_CERT_P12_BASE64 != '' && secrets.MAC_DEVID_CERT_PASSWORD != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag
        working-directory: .
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            && ! git branch -r --contains "$GITHUB_SHA" | grep -q '^ *origin/release/'; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main or a release/ branch."
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - name: No signing secrets, so nothing is attached
        if: env.SIGN != 'true'
        run: echo "::warning::Mac signing secrets aren't set; building unsigned and attaching nothing."
      - name: Put the Developer ID certificate in a temporary keychain
        if: env.SIGN == 'true'
        env:
          MAC_DEVID_CERT_P12_BASE64: ${{ secrets.MAC_DEVID_CERT_P12_BASE64 }}
          MAC_DEVID_CERT_PASSWORD: ${{ secrets.MAC_DEVID_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/mac.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$MAC_DEVID_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$MAC_DEVID_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Splitting is intended: the existing keychains are separate arguments.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/devid.p12"
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          test -n "$identity" || { echo "::error::No Developer ID Application identity in the certificate."; exit 1; }
          echo "MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
      - name: Build and check the universal zip
        run: |
          version=${GITHUB_REF_NAME#v}
          packaging/build-mac.sh "$version" "$RUNNER_TEMP/mac"
          zip="$RUNNER_TEMP/mac/phrased-$version-macos.zip"
          if [ "$SIGN" = true ]; then packaging/check-mac.sh "$zip" --signed; else packaging/check-mac.sh "$zip"; fi
      - name: Notarize
        if: env.SIGN == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          zip="$RUNNER_TEMP/mac/phrased-${GITHUB_REF_NAME#v}-macos.zip"
          # A bare binary can't be stapled; Gatekeeper fetches the ticket online on first launch.
          # || true: a rejected submission exits non-zero, and the status check below prints its log.
          xcrun notarytool submit "$zip" --key "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --output-format json | tee "$RUNNER_TEMP/notary.json" || true
          status=$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json")
          if [ "$status" != Accepted ]; then
            id=$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json")
            xcrun notarytool log "$id" --key "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
            echo "::error::Notarization: $status"
            exit 1
          fi
      - name: Render and check the cask
        run: |
          version=${GITHUB_REF_NAME#v}
          zip="$RUNNER_TEMP/mac/phrased-$version-macos.zip"
          packaging/homebrew/render.sh "$version" "$zip" "$RUNNER_TEMP/mac/phrased.rb"
          packaging/homebrew/check-cask.sh "$RUNNER_TEMP/mac/phrased.rb" "$version" "$zip"
          (cd "$RUNNER_TEMP/mac" && shasum -a 256 ./*.zip phrased.rb > SHA256SUMS-macos && cat SHA256SUMS-macos)
      - name: Attach them to the release
        if: env.SIGN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "Helper packages." ||
            gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/mac/* --clobber

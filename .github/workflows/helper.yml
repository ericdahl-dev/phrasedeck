name: helper

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: helper

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Linux package builds and passes its check (#78)
        run: |
          GOTOOLCHAIN=auto go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          packaging/build-linux.sh 0.0.0-ci amd64 "$RUNNER_TEMP/pkg"
          packaging/check-deb.sh "$RUNNER_TEMP/pkg/phrased_0.0.0-ci_amd64.deb"

  aur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - name: AUR phrased-bin builds with makepkg and passes its check (#78)
        working-directory: helper
        run: |
          GOTOOLCHAIN=auto go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          for arch in amd64 arm64; do packaging/build-linux.sh 0.0.0 "$arch" "$RUNNER_TEMP/pkg"; done
          packaging/aur/render.sh 0.0.0 "$RUNNER_TEMP/pkg"
          docker run --rm -v "$PWD:/w" -v "$RUNNER_TEMP/pkg:/pkg" archlinux:latest \
            sh /w/packaging/aur/makepkg-check.sh /pkg 0.0.0

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - run: go build ./...
      - run: go vet ./...
      - name: Mac backend tests (private pasteboard; no key events)
        run: go test ./internal/typer/
      - name: LaunchAgent plist lints
        run: make plist AGENT="$RUNNER_TEMP/dev.ericdahl.phrased.plist"
      - name: Universal zip and Homebrew cask build and pass their checks (#66)
        run: |
          packaging/build-mac.sh 0.0.0 "$RUNNER_TEMP/mac"
          packaging/check-mac.sh "$RUNNER_TEMP/mac/phrased-0.0.0-macos.zip"
          packaging/homebrew/render.sh 0.0.0 "$RUNNER_TEMP/mac/phrased-0.0.0-macos.zip" "$RUNNER_TEMP/mac/phrased.rb"
          packaging/homebrew/check-cask.sh "$RUNNER_TEMP/mac/phrased.rb" 0.0.0 "$RUNNER_TEMP/mac/phrased-0.0.0-macos.zip"

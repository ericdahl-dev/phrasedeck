name: ios

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  # No path filter on PRs: "test" is a required check, and a required check that
  # never starts would block helper-only PRs forever.
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Required checks can't be skipped with on.paths, so the job runs and skips its work when
      # a pull request doesn't touch these paths.
      - id: changes
        working-directory: .
        run: .github/scripts/touches.sh '^(ios/|\.github/workflows/ios\.yml$|\.github/scripts/touches\.sh$)'
      - name: Install XcodeGen
        if: steps.changes.outputs.run == 'true'
        run: brew install xcodegen
      - name: Generate project
        if: steps.changes.outputs.run == 'true'
        run: xcodegen
      - name: Pick an iPhone simulator
        if: steps.changes.outputs.run == 'true'
        run: |
          udid=$(xcrun simctl list devices available -j |
            jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$udid" && test "$udid" != null
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Unit and UI tests
        if: steps.changes.outputs.run == 'true'
        run: xcodebuild test -scheme Phrasedeck -destination "id=$SIM_UDID" -quiet -resultBundlePath "$RUNNER_TEMP/tests.xcresult"
      # -quiet hides why a test failed; the result bundle has the assertion and screenshots.
      - name: Keep the test results when something failed
        if: steps.changes.outputs.run == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/tests.xcresult
          retention-days: 14

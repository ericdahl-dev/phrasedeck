name: ios

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  # No path filter on PRs: "test" is a required check, and a required check that
  # never starts would block helper-only PRs forever.
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen
      - name: Pick an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j |
            jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$udid" && test "$udid" != null
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Unit and UI tests
        # A failing test is rerun once (only that test): SpotStorageTests flakes on this runner's
        # iOS 26.4.1 Simulator and not locally (#90). Drop the retry when #90 is fixed.
        run: xcodebuild test -scheme Phrasedeck -destination "id=$SIM_UDID" -quiet -resultBundlePath "$RUNNER_TEMP/tests.xcresult" -retry-tests-on-failure -test-iterations 2
      # -quiet hides why a test failed; the result bundle has the assertion and screenshots.
      - name: Keep the test results when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/tests.xcresult
          retention-days: 14

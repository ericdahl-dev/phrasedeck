; Phrasedeck USB dongle spike (#198): an ESP32-S3 SuperMini that the Computer sees as a wired USB
; keyboard, and that types the Phrases a bonded phone writes to its GATT service over Bluetooth LE.
; See README.md for flashing and testing.

[platformio]
; The panel's shared build cache (#175), so this project reuses the framework objects it compiled.
build_cache_dir = ~/.cache/phrasedeck/pio-build-cache

[common]
; The pure code shared with the panel (hid_keys, send, bt_pairing, ...), used in place: no copies.
lib_extra_dirs = ../firmware/lib
lib_deps = bblanchon/ArduinoJson @ 7.4.2   ; send.h needs it (the panel's Helper route)

[env:dongle]
; The same pioarduino release as the panel (Arduino-ESP32 3.3, NimBLE, TinyUSB).
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
; Eric's SuperMini is an ESP32-S3FH4R2: 4 MB of quad flash and 2 MB of quad PSRAM in the package.
; Nothing here needs the PSRAM, so the build leaves it off and also runs on boards without it.
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode          = qio
board_build.flash_size          = 4MB
board_upload.flash_size         = 4MB
board_upload.maximum_size       = 4194304
board_build.partitions          = default.csv   ; two 1.25 MB app slots, so OTA stays possible
; The devkit's flags with ARDUINO_USB_MODE=0: the S3's native USB runs TinyUSB, not the
; USB-Serial/JTAG unit, so the port can be a keyboard and a serial port (CDC) at once.
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
; After the first flash, `pio run -t upload` resets the board into its bootloader by opening the
; USB CDC port at 1200 baud, so BOOT doesn't have to be held again.
board_upload.use_1200bps_touch    = yes
board_upload.wait_for_upload_port = yes
extra_scripts = pre:../firmware/build_cache.py
lib_extra_dirs = ${common.lib_extra_dirs}
lib_deps       = ${common.lib_deps}

build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial is the TinyUSB CDC port: logs and commands
    ; The core starts USB before setup() with CDC on boot, so the names are set at build time.
    '-DUSB_PRODUCT="Phrasedeck dongle"'
    '-DUSB_MANUFACTURER="Phrasedeck"'

monitor_speed = 115200

; Host tests for the logic in lib/ and the shared libraries (no Arduino, no board): pio test -e native
[env:native]
platform = native
extra_scripts = pre:../firmware/build_cache.py
build_flags = -std=c++17 -Wall -Wextra
lib_extra_dirs = ${common.lib_extra_dirs}
lib_deps       = ${common.lib_deps}

; Phrasedeck panel (#68): Elecrow CrowPanel Advance 7.0-HMI (ESP32-S3-WROOM-1-N16R8).
; Board settings follow github.com/robominds/Crowpanel-Advance-7.0-HMI-Display (MIT),
; whose docs/HARDWARE.md explains each one.

[env:crowpanel]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
; Elecrow's own board JSON has native-USB ids on a CH340K board, so use the devkit plus overrides.
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi      ; quad flash, octal PSRAM
board_build.psram_type          = opi
board_build.flash_mode          = qio
board_upload.flash_size         = 16MB
board_build.partitions          = partitions.csv
extra_scripts                   = pre:wifi_secrets.py

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DCROWPANEL_ADVANCE_REV=140   ; Eric's board is V1.4 (silkscreen); the V1.3+ backlight and touch bytes
    ; No native USB: serial goes through the CH340K on GPIO43/44.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DLV_CONF_SKIP
    -DLV_KCONFIG_IGNORE
    -DLV_COLOR_DEPTH=16
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_USE_QRCODE=1               ; the web editor's address, for a phone camera
    ; LVGL's heap comes from PSRAM (lv_mem_psram.c), leaving internal RAM for Wi-Fi and TLS.
    -DLV_USE_STDLIB_MALLOC=LV_STDLIB_CUSTOM

lib_deps =
    bblanchon/ArduinoJson @ 7.4.2
    lovyan03/LovyanGFX @ 1.2.35   ; the version the board was first run with
    lvgl/lvgl @ 9.1.0

upload_speed  = 921600
monitor_speed = 115200

; Same firmware plus serial commands for testing without a finger on the glass (USB only):
;   pair <nearby index> <code> <short pin>     type <text>     tap <i>     send     edit <i> <text>     shot     pairscreen     key <chars>     ok
;   gear     pw <password>     tab <n>     setpw <password>     checkpw <password>     clearpw     add <text>     remove <i>     page <n>
;   rotate     flush
[env:crowpanel-dev]
extends     = env:crowpanel
build_flags = ${env:crowpanel.build_flags} -DPANEL_SERIAL_COMMANDS

; Display glitch and frame rate (#170): the same firmware plus a "perf:" line in the serial log
; every 5 s (frames/s, frame and flush times, free internal RAM). Stack the levers on top with
; PLATFORMIO_BUILD_FLAGS, e.g. PLATFORMIO_BUILD_FLAGS="-DPANEL_PCLK_HZ=14000000" pio run -e crowpanel-perf
;   -DPANEL_PCLK_HZ=14000000          pixel clock (default 16 MHz): less PSRAM bandwidth for the scan-out
;   -DLV_DEF_REFR_PERIOD=20           LVGL refresh and touch read period (default 33 ms, at most 30 frames/s)
;   -DPANEL_DRAW_LINES=20             draw buffer height (default 10): fewer flushes per full redraw
;   -DLV_DRAW_SW_SHADOW_CACHE_SIZE=32 reuse the Buttons' blurred shadow instead of redrawing it
[env:crowpanel-perf]
extends     = env:crowpanel
build_flags = ${env:crowpanel.build_flags} -DPANEL_PERF_LOG

; As crowpanel-perf, compiled -O2 instead of -Os: faster rendering, a bigger image.
[env:crowpanel-perf-o2]
extends       = env:crowpanel-perf
build_unflags = -Os
build_flags   = ${env:crowpanel-perf.build_flags} -O2

; Host tests for the logic in lib/ (no Arduino, no board): pio test -e native
[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
lib_deps = bblanchon/ArduinoJson @ 7.4.2

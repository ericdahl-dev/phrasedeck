name: Phrasedeck
options:
  bundleIdPrefix: dev.ericdahl
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Phrasedeck:
    type: application
    platform: iOS
    sources: [Phrasedeck]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericdahl.phrasedeck
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iCloud sync (#10): phrases and pages sync through CloudKit. Empty turns it off.
        CODE_SIGN_ENTITLEMENTS: Phrasedeck/Phrasedeck.entitlements
    info:
      path: Phrasedeck/Info.plist
      properties:
        CFBundleDisplayName: phrasedeck
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # The tailnet route is plain HTTP: *.ts.net plus bare tailnet names
        # and IPs. The LAN route (#11) is HTTPS with a pinned certificate.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        # phrasedeck://pair links from the QR code `phrased pair` prints (#25).
        CFBundleURLTypes:
          - CFBundleURLName: dev.ericdahl.phrasedeck.pair
            CFBundleURLSchemes: [phrasedeck]
        # Finds phrased on the home network so sends can skip Tailscale there (#11).
        NSBonjourServices: [_phrasedeck._tcp]
        NSLocalNetworkUsageDescription: phrasedeck looks for your computers on the home network so it can reach them without Tailscale.
        NSCameraUsageDescription: phrasedeck uses the camera only to scan the QR code that phrased pair shows, to add a computer.
        # No encryption beyond what the OS provides (TestFlight export compliance).
        ITSAppUsesNonExemptEncryption: false
        # Not empty once the entitlements above are set; the app syncs only then.
        PhrasedeckCloudSync: $(CODE_SIGN_ENTITLEMENTS)
        # CloudKit wakes the app with a silent push when the other device changes the deck.
        UIBackgroundModes: [remote-notification]
  PhrasedeckTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PhrasedeckTests]
    dependencies:
      - target: Phrasedeck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Hosted in the app so Keychain calls have an app's entitlements.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Phrasedeck.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Phrasedeck"
        BUNDLE_LOADER: "$(TEST_HOST)"
  PhrasedeckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PhrasedeckUITests]
    dependencies:
      - target: Phrasedeck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Phrasedeck
schemes:
  Phrasedeck:
    build:
      targets:
        Phrasedeck: all
    test:
      targets: [PhrasedeckTests, PhrasedeckUITests]

